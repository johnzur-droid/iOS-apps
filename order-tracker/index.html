<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Orders">
    <meta name="theme-color" content="#1a1a2e">
    <title>Order Tracker - Last 60 Days</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1>My Orders</h1>
            <span class="subtitle">Last 60 Days</span>
        </header>

        <!-- Summary Stats -->
        <div id="summaryStats" class="summary-stats">
            <div class="stat-card">
                <div class="stat-value" id="totalSpent">$0.00</div>
                <div class="stat-label">Total Spent</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">Orders</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="pendingOrders">0</div>
                <div class="stat-label">In Transit</div>
            </div>
        </div>

        <!-- Category Filters -->
        <div class="filter-section">
            <div class="filter-label">Categories</div>
            <div id="filterButtons" class="filter-buttons"></div>
        </div>

        <!-- Status Filters -->
        <div class="filter-section status-section">
            <div class="filter-label">Status</div>
            <div id="statusFilterButtons" class="status-filter-buttons"></div>
        </div>

        <!-- Orders List -->
        <main id="ordersContainer" class="orders-container">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading orders...</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <span>Updated: <span id="lastUpdated">--</span></span>
            <button onclick="refreshData()" class="refresh-btn">Refresh</button>
        </footer>
    </div>

    <script src="orders-data.js"></script>
    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Orders">
    <meta name="theme-color" content="#1a1a2e">
    <title>Order Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css?v=63">
</head>
<body>
    <div class="app-container">
        <!-- Header with Time Selector -->
        <header class="app-header">
            <h1>My Orders</h1>
            <div class="time-selector">
                <button class="time-btn" data-days="30">30d</button>
                <button class="time-btn active" data-days="90">90d</button>
                <button class="time-btn" data-days="180">6mo</button>
                <button class="time-btn" data-days="365">1yr</button>
            </div>
        </header>

        <!-- Auth Section -->
        <div id="authSection" class="auth-section">
            <div class="auth-content">
                <div class="auth-icon">📧</div>
                <h2>Connect Gmail</h2>
                <p>Sign in to scan your emails for orders, shipments, and deliveries.</p>
                <button id="authorizeBtn" class="auth-btn">Connect Gmail Account</button>
            </div>
        </div>

        <!-- Loading Section -->
        <div id="loadingSection" class="loading-section hidden">
            <div class="spinner"></div>
            <p id="scanProgress">Connecting...</p>
            <p class="loading-note" id="loadingNote">Scanning your emails...</p>
        </div>

        <!-- Orders Section -->
        <div id="ordersSection" class="orders-section hidden">
            <!-- Summary Cards - Tappable -->
            <div class="summary-cards">
                <div class="summary-card" data-filter="all" id="cardSpent">
                    <div class="card-value" id="totalSpent">$0</div>
                    <div class="card-label">Total Spent</div>
                </div>
                <div class="summary-card" data-filter="all" id="cardOrders">
                    <div class="card-value" id="totalOrders">0</div>
                    <div class="card-label">Orders</div>
                </div>
                <div class="summary-card" data-filter="delivered" id="cardDelivered">
                    <div class="card-value" id="deliveredCount">0</div>
                    <div class="card-label">Delivered</div>
                </div>
                <div class="summary-card active" data-filter="pending" id="cardPending">
                    <div class="card-value" id="pendingCount">0</div>
                    <div class="card-label">In Transit</div>
                </div>
            </div>

            <!-- Active Filter Indicator -->
            <div class="filter-indicator">
                <span id="filterLabel">Showing: In Transit</span>
                <button id="clearFilter" class="clear-filter hidden">Show All</button>
            </div>

            <!-- Orders List -->
            <main id="ordersContainer" class="orders-container"></main>

            <!-- Footer -->
            <footer class="app-footer">
                <span>Updated: <span id="lastUpdated">--</span></span>
                <button id="refreshBtn" class="refresh-btn">Refresh</button>
            </footer>
        </div>

        <!-- Error Section -->
        <div id="errorSection" class="error-section hidden">
            <div class="error-content">
                <div class="error-icon">⚠️</div>
                <p id="errorMessage">An error occurred</p>
                <button id="retryBtn" class="retry-btn">Try Again</button>
            </div>
        </div>
    </div>

    <!-- Google APIs -->
    <script src="https://apis.google.com/js/api.js" async defer onload="gapiLoaded()"></script>
    <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
    <script src="app.js?v=63"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Orders">
    <meta name="theme-color" content="#1a1a2e">
    <title>Pending Orders</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        .app { max-width: 600px; margin: 0 auto; padding: 16px; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #333;
        }
        .header h1 { font-size: 24px; font-weight: 600; }
        .count { background: #4CAF50; padding: 4px 12px; border-radius: 20px; font-size: 14px; }
        .hidden { display: none !important; }

        /* Auth Section */
        .auth-section {
            text-align: center;
            padding: 60px 20px;
        }
        .auth-icon { font-size: 64px; margin-bottom: 20px; }
        .auth-section h2 { margin-bottom: 12px; }
        .auth-section p { color: #888; margin-bottom: 24px; }
        .auth-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        /* Loading */
        .loading-section { text-align: center; padding: 60px 20px; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #333;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Orders */
        .order-card {
            background: #252540;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .order-item {
            font-size: 16px;
            font-weight: 600;
            flex: 1;
            padding-right: 12px;
        }
        .dismiss-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .dismiss-btn:active { opacity: 0.8; }
        .order-details { font-size: 14px; }
        .detail {
            padding: 4px 0;
            border-bottom: 1px solid #333;
        }
        .detail:last-child { border-bottom: none; }
        .label { color: #888; margin-right: 8px; }
        .tracking-link {
            color: #667eea;
            text-decoration: none;
            word-break: break-all;
        }
        .tracking-link:hover { text-decoration: underline; }

        /* Subscription styling */
        .order-card.subscription {
            border-left: 3px solid #9b59b6;
        }
        .sub-badge {
            background: #9b59b6;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: normal;
            margin-left: 8px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        .empty-icon { font-size: 64px; margin-bottom: 16px; }

        /* Error */
        .error-section { text-align: center; padding: 60px 20px; }
        .error-icon { font-size: 48px; margin-bottom: 16px; }
        .retry-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            margin-top: 16px;
            cursor: pointer;
        }

        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #333;
            color: #666;
            font-size: 12px;
        }
        .refresh-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>Pending Orders</h1>
            <span class="count" id="orderCount">0</span>
        </header>

        <!-- Auth Section -->
        <div id="authSection" class="auth-section">
            <div class="auth-icon">📧</div>
            <h2>Connect Gmail</h2>
            <p>Sign in to scan for pending orders</p>
            <button id="authorizeBtn" class="auth-btn">Connect Gmail</button>
        </div>

        <!-- Loading Section -->
        <div id="loadingSection" class="loading-section hidden">
            <div class="spinner"></div>
            <p id="scanProgress">Connecting...</p>
        </div>

        <!-- Orders Section -->
        <div id="ordersSection" class="hidden">
            <div id="ordersContainer"></div>
            <div class="footer">
                <span>Updated: <span id="lastUpdated">--</span></span>
                <button id="refreshBtn" class="refresh-btn">Refresh</button>
            </div>
        </div>

        <!-- Error Section -->
        <div id="errorSection" class="error-section hidden">
            <div class="error-icon">⚠️</div>
            <p id="errorMessage">Something went wrong</p>
            <button id="retryBtn" class="retry-btn">Try Again</button>
        </div>
    </div>

    <script src="https://apis.google.com/js/api.js" async defer onload="gapiLoaded()"></script>
    <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
    <script src="app.js?v=72"></script>
</body>
</html>
